<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CODYSSEY</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f6f7f9; --bg3: #eceef2;
    --fg: #14171c; --fg2: #5b6472; --line: #dfe3ea;
    --accent: #2f6df6; --lock: #d9480f; --lock-bg: #fff1e8;
    --ok: #1a7f37; --warn: #b7791f; --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --bg2: #1a1e25; --bg3: #232830;
      --fg: #e6e9ef; --fg2: #98a2b3; --line: #2c323c;
      --accent: #5b8cff; --lock: #ff8a5b; --lock-bg: #3a2318;
      --ok: #4ac26b; --warn: #e3b341; --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, "Segoe UI", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--bg2); position: sticky; top: 0; z-index: 10;
  }
  .logo { font-weight: 700; letter-spacing: .5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .dot.off { background: #d64545; }
  .counts { color: var(--fg2); font-size: 13px; display: flex; gap: 14px; }
  .counts b { color: var(--fg); font-variant-numeric: tabular-nums; }
  header .spacer { flex: 1; }
  button {
    font: inherit; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); cursor: pointer;
  }
  button:hover { background: var(--bg3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--lock); border-color: var(--lock); color: #fff; }
  button.small { padding: 3px 9px; font-size: 12px; }

  main { display: grid; grid-template-columns: 260px 1fr 320px; height: calc(100vh - 57px); }
  aside { overflow-y: auto; padding: 14px; border-right: 1px solid var(--line); background: var(--bg2); }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  section { margin-bottom: 22px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--fg2); margin: 0 0 8px; }
  .hint { font-size: 12px; color: var(--fg2); line-height: 1.5; margin: 0 0 10px; }

  .item {
    padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 13px;
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
  }
  .item:hover { background: var(--bg3); }
  .item.active { background: var(--accent); color: #fff; }
  .feat { margin-bottom: 4px; }
  .feat.locked .item { background: var(--lock-bg); }
  .featbar { padding: 0 9px 6px; }
  button.tiny {
    font-size: 11px; padding: 2px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg2); cursor: pointer;
  }
  button.tiny.danger { background: var(--bg); color: var(--lock); border-color: var(--lock); }
  button.tiny:hover { background: var(--bg3); }
  .item .num { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
  .path { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; word-break: break-all; }

  #canvas { overflow: auto; background: var(--bg); position: relative; }
  svg { display: block; }
  .node rect { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; rx: 7; cursor: pointer; }
  .node.entry rect { fill: var(--bg3); stroke: var(--accent); stroke-width: 2; }
  .node.locked rect { fill: var(--lock-bg); stroke: var(--lock); stroke-width: 2; }
  .node.sel rect { stroke: var(--accent); stroke-width: 3; }
  .node.dim { opacity: .18; }
  .node text { font-size: 11px; fill: var(--fg); pointer-events: none; font-family: ui-monospace, Consolas, monospace; }
  .node .sub { font-size: 9px; fill: var(--fg2); }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
  .edge.http { stroke: var(--accent); stroke-dasharray: 4 3; }
  .edge.hot { stroke: var(--accent); stroke-width: 2.4; }
  .edge.dim { opacity: .1; }

  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 9px; padding: 11px; margin-bottom: 9px; }
  .card.warn { border-color: var(--warn); }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 20px;
    background: var(--bg3); color: var(--fg2); margin: 2px 3px 2px 0;
  }
  .badge.lock { background: var(--lock-bg); color: var(--lock); }
  .row { display: flex; gap: 6px; align-items: center; }
  .empty { color: var(--fg2); font-size: 13px; padding: 8px 0; }
  .log { font-size: 12px; padding: 6px 8px; border-radius: 6px; margin-bottom: 5px; background: var(--bg3); }
  .log.block { background: var(--lock-bg); color: var(--lock); }
  .log time { opacity: .6; font-size: 11px; }
  .legend { font-size: 11px; color: var(--fg2); display: flex; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--line); }
  .colhead { font-size: 11px; fill: var(--fg2); font-weight: 700; }
  .colsub { font-size: 10px; fill: var(--fg2); opacity: .75; font-family: ui-monospace, Consolas, monospace; }
  .zoomlv { font-size: 12px; color: var(--fg2); min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
  .shown { font-size: 12px; color: var(--fg2); }
  .shown a { color: var(--accent); }
  .node.module rect { stroke-dasharray: 0; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .segbtn {
    border: 0; border-radius: 0; padding: 5px 10px; font-size: 12px;
    background: var(--bg); color: var(--fg2); cursor: pointer;
  }
  .segbtn + .segbtn { border-left: 1px solid var(--line); }
  .segbtn.on { background: var(--accent); color: #fff; }
  .toggle { font-size: 12px; color: var(--fg2); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  /* 파일 속 */
.sym { margin: 8px 0 }
.sym-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.sym-name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sym-len { font-size: 11px; opacity: .6; flex: none }
.sym-bar { height: 4px; background: var(--bg3); border-radius: 2px; margin: 3px 0 2px; overflow: hidden }
.sym-bar i { display: block; height: 100%; background: var(--accent) }
.sym-sub { font-size: 10px; opacity: .5; font-family: ui-monospace, monospace }

/* 첫 화면 */
  .home { padding: 18px; border-bottom: 1px solid var(--line); background: var(--bg2); }
  .home.hidden { display: none; }
  .home h1 { font-size: 17px; margin: 0 0 4px; font-weight: 700; }
  .home .lead { color: var(--fg2); font-size: 13px; margin: 0 0 14px; }
  .todo {
    display: flex; align-items: center; gap: 12px; padding: 11px 13px; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
  }
  .todo.warn { border-color: var(--lock); background: var(--lock-bg); }
  .todo .txt { flex: 1; font-size: 13px; line-height: 1.5; }
  .todo .txt b { font-weight: 700; }
  .todo .sub { color: var(--fg2); font-size: 12px; }
  .home .more { margin-top: 12px; font-size: 12px; color: var(--fg2); }
  .home .more a { color: var(--accent); cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 20px;
    background: var(--bg3); color: var(--fg); cursor: pointer;
  }
  .chip:hover { background: var(--accent); color: #fff; }
  .chip.locked { background: var(--lock-bg); color: var(--lock); }

  .banner {
    background: var(--lock-bg); color: var(--lock); border-bottom: 1px solid var(--lock);
    padding: 9px 18px; font-size: 13px;
  }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
</style>
</head>
<body>
<header>
  <span class="logo">CODYSSEY</span>
  <span><span class="dot" id="dot"></span></span>
  <div class="counts">
    <span><span data-t="ui.files"></span> <b id="c-files">-</b></span>
    <span><span data-t="ui.features"></span> <b id="c-features">-</b></span>
    <span><span data-t="ui.protecting"></span> <b id="c-locks">-</b></span>
  </div>
  <div class="spacer"></div>
  <span id="shown" class="shown"></span>
  <div class="seg">
    <button class="segbtn" data-scope="near" data-t="ui.scopeNear"></button>
    <button class="segbtn" data-scope="module" data-t="ui.scopeModule"></button>
    <button class="segbtn" data-scope="all" data-t="ui.scopeAll"></button>
  </div>
  <label class="toggle"><input type="checkbox" id="chk-empty"> <span data-t="ui.showEmpty"></span></label>
  <button class="small" id="btn-fit" data-t="ui.fit"></button>
  <button class="small" id="btn-zoom-out">−</button>
  <span id="zoomlv" class="zoomlv">100%</span>
  <button class="small" id="btn-zoom-in">+</button>
  <button id="btn-rescan" data-t="ui.rescan"></button>
</header>

<div id="banner"></div>

<!--
  첫 화면은 '지금 어떤 상태이고 무엇을 하면 되는가' 다.
  그림부터 보여주면 코드를 모르는 사람은 거기서 닫는다.
-->
<div id="home"></div>

<main>
  <aside>
    <section>
      <h2 data-t="ui.sideFeatures"></h2>
      <p class="hint" data-t="ui.sideFeaturesHint"></p>
      <div class="item active" data-feature="" id="feat-all">
        <span data-t="ui.showAll"></span>
      </div>
      <div id="features"></div>
    </section>

    <section>
      <h2 data-t="ui.sideModules"></h2>
      <p class="hint" data-t="ui.sideModulesHint"></p>
      <div id="modules"></div>
    </section>

    <section>
      <h2 data-t="ui.sideProtect"></h2>
      <p class="hint" data-t="ui.sideProtectHint"></p>
      <div id="suggestions"></div>
    </section>
  </aside>

  <div id="canvas"></div>

  <aside class="right">
    <section id="detail-wrap">
      <h2 data-t="ui.sidePicked"></h2>
      <div id="detail"><p class="empty" data-t="ui.pickPrompt"></p></div>
    </section>

    <section>
      <h2 data-t="ui.sideActivity"></h2>
      <p class="hint" data-t="ui.sideActivityHint"></p>
      <div id="activity"><p class="empty" data-t="ui.nothingYet"></p></div>
    </section>
  </aside>
</main>

<div class="legend">
  <span><span class="swatch" style="background:var(--bg3);border:2px solid var(--accent)"></span><span data-t="ui.legendEntry"></span></span>
  <span><span class="swatch" style="background:var(--lock-bg);border:2px solid var(--lock)"></span><span data-t="ui.legendLocked"></span></span>
  <span><span class="swatch" style="background:var(--accent)"></span><span data-t="ui.legendHttp"></span></span>
</div>

<script>
const $ = s => document.querySelector(s)
let S = null, selected = null, activeFeature = '', activeModule = '', showEmpty = false, zoom = 'fit'
/** 큰 레포에서 전체 그래프는 실타래가 된다. 기본은 '주변만'. */
let homeClosed = false
let scope = 'near'
/** 전체 보기에서 파일까지 펼칠지. 기본은 모듈로 접어서 본다. */
let expandAll = false
let hops = 1

async function load() {
  try {
    S = await (await fetch('/api/state')).json()
    // 데몬이 구버전이면 새 필드가 없다. 화면이 통째로 죽는 것보다 낫다.
    S.modules ??= []
    S.suggestions = (S.suggestions ?? []).map(x => ({ kind: 'feature', why: [], ...x, why: x.why ?? x.features ?? [] }))
    S.activity ??= []
    S.features ??= []
    S.edges ??= []
    S.nodes ??= []
    // 쓸 말은 데몬이 준다. 구버전이면 안 온다 - 그때는 키가 그대로 보인다.
    if (S.strings) {
      STR = S.strings
      applyStaticText()
      if (S.lang) document.documentElement.lang = S.lang
    }
    $('#dot').classList.remove('off')
  } catch {
    $('#dot').classList.add('off')
    return
  }
  render()
}

/**
 * 첫 화면. 코드를 모르는 사람이 열었을 때 '무슨 프로젝트고 지금 뭘 하면 되는지'
 * 만 보이면 된다. 그림은 그 아래에 있고, 필요하면 접을 수 있다.
 */
function renderHome() {
  const el = $('#home')
  if (!el) return
  if (homeClosed) { el.className = 'home hidden'; el.innerHTML = ''; return }

  const feats = S.features ?? []
  const sugg = S.suggestions ?? []
  const locked = S.nodes.filter(n => n.locked)
  const blocked = (S.activity ?? []).filter(a => a.action === 'block' || a.action === 'ask')

  const todos = []
  if (sugg.length) {
    todos.push(`<div class="todo warn">
      <div class="txt">
        ${T('ui.homeFoundShared', { count: sugg.length })}
        <div class="sub">${T('ui.homeFoundSharedSub')}</div>
      </div>
      <button class="danger" id="lock-all">${T('ui.protectAll')}</button>
    </div>`)
  }
  if (locked.length) {
    todos.push(`<div class="todo">
      <div class="txt">
        ${T('ui.homeProtecting', { count: locked.length })}
        <div class="sub">${locked.slice(0, 3).map(n => esc(n.label ?? n.id)).join(', ')}${locked.length > 3 ? ' ' + T('ui.andMore', { count: locked.length - 3 }) : ''}</div>
      </div>
    </div>`)
  }
  if (blocked.length) {
    const last = blocked[0]
    todos.push(`<div class="todo">
      <div class="txt">
        ${T('ui.homeJustBlocked')}
        <div class="sub">${esc(last.reason ?? '')}</div>
      </div>
    </div>`)
  }
  if (!todos.length) {
    todos.push(`<div class="todo">
      <div class="txt">${T('ui.homeNothingToProtect')}
      <div class="sub">${T('ui.homeNothingSub')}</div></div>
    </div>`)
  }

  el.className = 'home'
  el.innerHTML = `
    <h1>${feats.length ? T('ui.homeTitleFeatures', { count: feats.length }) : T('ui.homeTitleFiles', { count: S.counts.files })}</h1>
    <p class="lead">${T('ui.homeLead')}</p>
    ${feats.length ? `<div class="chips">${feats
      .slice(0, 10)
      .map(f => `<span class="chip ${f.locked ? 'locked' : ''}" data-feature="${esc(f.id)}">${f.locked ? '🔒 ' : ''}${esc(f.label ?? f.id)}</span>`)
      .join('')}</div>` : ''}
    <div style="margin-top:14px">${todos.join('')}</div>
    <div class="more"><a id="home-close">${T('ui.homeClose')} ↓</a></div>`
}

function render() {
  $('#banner').innerHTML = S.foreign
    ? `<div class="banner">${T('ui.foreignBanner', { count: S.foreign })}
       </div>`
    : ''
  renderHome()
  for (const b of document.querySelectorAll('.segbtn')) b.classList.toggle('on', b.dataset.scope === scope && !activeFeature)
  const chk = $('#chk-empty'); if (chk) chk.checked = showEmpty
  $('#c-files').textContent = S.counts.files
  $('#c-features').textContent = S.counts.features
  $('#c-locks').textContent = S.counts.locks

  $('#features').innerHTML = S.features.map(f => `
    <div class="feat ${f.locked ? 'locked' : ''}">
      <div class="item ${activeFeature === f.id ? 'active' : ''}" data-feature="${esc(f.id)}">
        <span>${f.locked ? '🔒 ' : ''}${esc(f.label ?? label(f))}</span><span class="num">${f.size}</span>
      </div>
      <div class="featbar">
        <button class="tiny ${f.locked ? '' : 'danger'}"
                data-featlock="${esc(f.id)}" data-unlock="${f.locked ? '1' : ''}">
          ${f.locked ? T('ui.unprotect') : T('ui.protectScreen', { count: f.exclusive })}
        </button>
      </div>
    </div>`).join('')
  $('#feat-all').classList.toggle('active', !activeFeature)

  $('#suggestions').innerHTML = S.suggestions.length
    ? S.suggestions.map(s => `
      <div class="card">
        <div><b>${esc(s.label ?? s.file.split('/').pop())}</b></div>
        <div class="path" style="opacity:.7">${esc(s.file)}</div>
        <div>${s.why.map(f => `<span class="badge">${esc(shortFeature(f))}</span>`).join('')}</div>
        <div class="hint" style="margin:4px 0 0">${T('ui.sharedBy', { count: s.why.length })}</div>
        <div class="row" style="margin-top:8px">
          <button class="small danger" data-lock="${esc(s.file)}">${T('ui.protect')}</button>
        </div>
      </div>`).join('')
    : `<p class="empty">${T('ui.nothingToSuggest')}</p>`

  $('#modules').innerHTML = (S.modules ?? []).slice(0, 12).map(m => `
    <div class="item ${activeModule === m.name && scope === 'module' ? 'active' : ''}" data-module="${esc(m.name)}">
      <span>${esc(m.label ?? m.name)}<br><span class="path" style="opacity:.6">${esc(m.name)}</span></span><span class="num">${m.files}</span>
    </div>`).join('') || '<p class="empty">-</p>'

  $('#activity').innerHTML = S.activity.length
    ? S.activity.map(a => `
      <div class="log ${a.action === 'block' ? 'block' : ''}">
        <time>${new Date(a.at).toLocaleTimeString('ko-KR')}</time>
        ${a.action === 'block' ? T('ui.blocked') : a.action === 'ask' ? T('ui.asked') : T('ui.allowed')}
        &middot; <span class="path">${esc(a.file)}</span>
        ${a.reason ? `<div style="margin-top:3px">${esc(a.reason)}</div>` : ''}
      </div>`).join('')
    : `<p class="empty">${T('ui.nothingYet')}</p>`

  drawGraph()
  renderDetail()
}

const label = f => f.kind === 'page' ? f.id.replace('PAGE ', T('ui.screenPrefix')) : f.id
const shortFeature = id => id.replace('PAGE ', '')


/**
 * 쓰는 말.
 *
 * 카탈로그를 여기 또 두면 서버 쪽과 두 벌이 되어 조용히 어긋난다.
 * 데몬이 /api/state 로 지금 말에 맞는 것만 내려주고 화면은 받아 쓴다.
 * 아직 안 받았으면 키를 그대로 보여준다 - 화면이 죽는 것보다 낫다.
 */
let STR = {}
const T = (k, vars) => {
  let out = STR[k] ?? k
  if (vars) for (const [n, v] of Object.entries(vars)) out = out.split('{' + n + '}').join(String(v))
  return out
}

/** data-t 가 달린 정적 마크업을 한 번에 채운다. */
function applyStaticText() {
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T(el.dataset.t)
  for (const el of document.querySelectorAll('[data-t-html]')) el.innerHTML = T(el.dataset.tHtml)
}

// ---------------------------------------------------------------- 그래프

const H = 46, GAP = 22, HEAD = 34
/** 상자 폭. 모듈 이름은 짧아서 좁게 그려도 읽히고, 그만큼 배율이 올라간다. */
let W = 186

function drawGraph() {
  const vm = viewModel()
  W = vm.collapsed ? 150 : 186
  const shown = vm.items
  const edges = vm.edges
  const focus = activeFeature && !vm.collapsed ? new Set(nodesOfFeature(activeFeature)) : null

  const layer = assignLayers(shown, edges)
  const cols = new Map()
  for (const n of shown) {
    const L = layer.get(n.id) ?? 0
    if (!cols.has(L)) cols.set(L, [])
    cols.get(L).push(n)
  }
  const order = [...cols.keys()].sort((a, b) => a - b)
  order.forEach(L => cols.get(L).sort((a, b) => (a.id < b.id ? -1 : 1)))
  reduceCrossings(cols, order, edges)

  // 층이 많고 층당 노드가 적으면 위->아래가, 반대면 왼쪽->오른쪽이 화면에 잘 맞는다.
  const box = $('#canvas')
  const rows = Math.max(...order.map(L => cols.get(L).length))
  const vertical = pickOrientation(order.length, rows, box)
  // 한 줄에 몇 개까지 쌓을지: 화면 높이(가로배치)나 너비(세로배치)에 맞춘다
  const wrapAt = vertical
    ? Math.max(3, Math.floor((box.clientWidth - 60) / (W + GAP)))
    : Math.max(3, Math.floor((box.clientHeight - HEAD - 60) / (H + GAP)))
  const layout = place(cols, order, vertical, wrapAt)

  if (zoom === 'fit') {
    zoom = Math.max(0.4, Math.min(1, (box.clientWidth - 28) / layout.width, (box.clientHeight - 28) / layout.height))
  }

  const heads = order.map((L, i) => {
    const a = layout.head(i)
    const name = i === 0 ? T('ui.entryStep') : T('ui.step', { n: i })
    return `<text class="colhead" x="${a.x}" y="${a.y}">${esc(name)}</text>` +
           `<text class="colsub" x="${a.x}" y="${a.y + 13}">${esc(commonDir(cols.get(L)))}</text>`
  }).join('')

  const paths = edges.map(e => {
    const a = layout.pos.get(e.from), b = layout.pos.get(e.to)
    if (!a || !b) return ''
    const dim = focus && !(focus.has(e.from) && focus.has(e.to))
    const hot = selected && (e.from === selected || e.to === selected)
    const d = vertical
      ? bez(a.x + W / 2, a.y + H, b.x + W / 2, b.y, true)
      : bez(a.x + W, a.y + H / 2, b.x, b.y + H / 2, false)
    return `<path class="edge ${e.kind} ${dim ? 'dim' : ''} ${hot ? 'hot' : ''}" d="${d}"/>`
  }).join('')

  const boxes = shown.map(n => {
    const p = layout.pos.get(n.id)
    if (!p) return ''
    const dim = focus && !focus.has(n.id)
    const cls = ['node', n.isEntry && 'entry', n.locked && 'locked', selected === n.id && 'sel', dim && 'dim'].filter(Boolean).join(' ')
    const attr = n.isModule ? `data-module="${esc(n.id)}"` : `data-node="${esc(n.id)}"`
    return `<g class="${cls}" ${attr}>
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}"></rect>
      <text x="${p.x + 10}" y="${p.y + 19}">${esc(trunc(n.label, 23))}${n.locked && !n.isModule ? ' 🔒' : ''}</text>
      <text class="sub" x="${p.x + 10}" y="${p.y + 34}">${esc(trunc(n.sub, 29))}</text>
    </g>`
  }).join('')

  $('#canvas').innerHTML =
    `<svg width="${Math.round(layout.width * zoom)}" height="${Math.round(layout.height * zoom)}"
          viewBox="0 0 ${layout.width} ${layout.height}">${heads}${paths}${boxes}</svg>`
  $('#zoomlv').textContent = Math.round(zoom * 100) + '%'
  $('#shown').innerHTML = vm.collapsed
    ? `${T('ui.collapsedToModules', { count: shown.length })} · <a href="#" id="expand">${T('ui.expandToFiles')}</a>`
    : scope === 'near' && hiddenCount
      ? T('ui.shownHidden', { shown: shown.length, hidden: hiddenCount })
      : T('ui.shownOf', { shown: shown.length, total: S.counts.files })
}

const bez = (x1, y1, x2, y2, v) =>
  v ? `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`
    : `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}`

/** 두 방향의 가로세로 비를 실제 캔버스와 비교해서 덜 찌그러지는 쪽을 고른다. */
function pickOrientation(layers, rows, box) {
  const aw = Math.max(300, box.clientWidth - 28)
  const ah = Math.max(300, box.clientHeight - 28)
  const horiz = Math.min(aw / (layers * (W + GAP)), ah / (rows * (H + GAP) + HEAD))
  const vert = Math.min(aw / (rows * (W + GAP)), ah / (layers * (H + GAP + HEAD)))
  return vert > horiz
}

/**
 * 한 층에 노드가 많으면 접어서 여러 줄로 놓는다.
 * 안 접으면 21개짜리 층 하나 때문에 그림 전체가 세로로 길어져서 배율이 반토막 난다.
 */
function place(cols, order, vertical, wrapAt) {
  const pos = new Map()
  const heads = []
  let width = 0
  let height = 0
  let cursor = 20 // 진행 방향 오프셋

  order.forEach((L, i) => {
    const list = cols.get(L)
    const lanes = Math.max(1, Math.ceil(list.length / wrapAt))
    const perLane = Math.ceil(list.length / lanes)

    heads[i] = vertical ? { x: 20, y: cursor - 20 } : { x: cursor, y: 16 }

    list.forEach((n, idx) => {
      const lane = Math.floor(idx / perLane)
      const slot = idx % perLane
      const p = vertical
        ? { x: 20 + slot * (W + GAP), y: cursor + lane * (H + GAP) }
        : { x: cursor + lane * (W + GAP), y: HEAD + 8 + slot * (H + GAP) }
      pos.set(n.id, p)
      width = Math.max(width, p.x + W + 20)
      height = Math.max(height, p.y + H + 20)
    })

    cursor += lanes * (vertical ? H + GAP : W + GAP) + (vertical ? HEAD : GAP * 1.5)
  })

  return { pos, width, height, head: i => heads[i] ?? { x: 20, y: 16 } }
}

/**
 * 무엇을 그릴지 정한다.
 *
 * 전체 보기에서 파일 408개를 그리면 상자는 어찌어찌 들어가도 **선 1039개**가
 * 화면을 덮어버린다. 문제는 상자 수가 아니라 연결 수다.
 * 그래서 전체 보기는 기본적으로 모듈(폴더 묶음) 단위로 접는다.
 * 44개 상자에 선 수십 개면 전체 구조가 한눈에 들어온다.
 */
function viewModel() {
  const files = visibleNodes()
  const collapse = scope === 'all' && !expandAll && !activeFeature && files.length > COLLAPSE_AT
  if (!collapse) {
    const ids = new Set(files.map(n => n.id))
    return {
      collapsed: false,
      items: files.map(n => ({
        id: n.id,
        label: n.id.split('/').pop(),
        sub: n.id.slice(0, n.id.length - (n.id.split('/').pop()?.length ?? 0)),
        locked: n.locked,
        isEntry: n.isEntry,
        module: n.module,
      })),
      edges: S.edges.filter(e => ids.has(e.from) && ids.has(e.to)),
    }
  }

  // 모듈로 접기
  const modOf = new Map(S.nodes.map(n => [n.id, n.module || '(root)']))
  const stat = new Map()
  for (const n of files) {
    const m = modOf.get(n.id)
    const cur = stat.get(m) ?? { files: 0, locked: 0, entries: 0 }
    cur.files++
    if (n.locked) cur.locked++
    if (n.isEntry) cur.entries++
    stat.set(m, cur)
  }
  const pairs = new Map()
  for (const e of S.edges) {
    const a = modOf.get(e.from)
    const b = modOf.get(e.to)
    if (!a || !b || a === b || !stat.has(a) || !stat.has(b)) continue
    const key = a + ' >> ' + b
    const cur = pairs.get(key) ?? { from: a, to: b, kind: e.kind, confidence: 'high', n: 0 }
    cur.n++
    if (e.kind === 'http') cur.kind = 'http'
    pairs.set(key, cur)
  }
  return {
    collapsed: true,
    items: [...stat.entries()].map(([m, v]) => ({
      id: m,
      label: m.split('/').slice(-2).join('/') || m,
      sub: `${T('ui.filesCount', { count: v.files })}${v.locked ? ` · 🔒${v.locked}` : ''}`,
      locked: v.locked > 0,
      isEntry: v.entries > 0,
      module: m,
      isModule: true,
    })),
    edges: [...pairs.values()],
  }
}

/** 이 수를 넘으면 전체 보기를 모듈로 접는다. */
const COLLAPSE_AT = 80

/**
 * 화면에 그릴 노드를 고른다.
 *
 * 400 파일짜리 레포를 통째로 그리면 40% 배율에 선 1000개짜리 실타래가 된다.
 * 실제로 그렇게 만들어놓고 보니 아무것도 읽을 수 없었다.
 * 사람이 보고 싶은 건 조감도가 아니라 '내가 지금 건드리는 곳 주변' 이다.
 */
function visibleNodes() {
  let list = showEmpty ? S.nodes : S.nodes.filter(n => n.isEntry || n.symbols > 0)

  if (activeFeature) {
    const inFeature = new Set(nodesOfFeature(activeFeature))
    return list.filter(n => inFeature.has(n.id))
  }
  if (scope === 'all') return list
  if (scope === 'module') {
    const mod = activeModule || S.nodes.find(n => n.id === selected)?.module
    if (mod) return list.filter(n => n.module === mod)
    return list
  }

  // 주변만: 씨앗에서 넓혀가되 개수 예산을 넘기지 않는다.
  // 예산이 없으면 400 파일짜리 레포에서 결국 전부 그리게 된다.
  const seeds = focusSeeds(list)
  if (!seeds.length) return list
  const near = budgetedNeighborhood(seeds, list, BUDGET)
  return list.filter(n => near.has(n.id))
}

/**
 * 한 화면에서 사람이 읽을 수 있는 상자 수.
 * 60 으로 해봤더니 한 열에 45개가 쌓여 40% 배율로 줄어들었다. 24 면 100% 로 읽힌다.
 * '이 파일을 쓰는 곳' 전체 목록은 오른쪽 패널에 있으니 그림이 다 보여줄 필요가 없다.
 */
const BUDGET = 24

/**
 * 씨앗에서 한 겹씩 넓히되 예산 안에서만 채운다.
 *
 * 겹 통째로 못 넣으면 멈추게 했더니, 허브 파일 하나가 이웃 100개를 달고 있어서
 * 상자 세 개만 보였다. 그래서 겹을 잘라 넣되 몇 개를 숨겼는지 반드시 알린다.
 * 조용히 줄이면 사용자가 그게 전부라고 믿는다.
 */
let hiddenCount = 0

function budgetedNeighborhood(seeds, list, budget) {
  const ids = new Set(list.map(n => n.id))
  const deg = new Map()
  const adj = new Map()
  for (const e of S.edges) {
    if (!ids.has(e.from) || !ids.has(e.to)) continue
    for (const [a, b] of [[e.from, e.to], [e.to, e.from]]) {
      const arr = adj.get(a)
      if (arr) arr.push(b)
      else adj.set(a, [b])
      deg.set(a, (deg.get(a) ?? 0) + 1)
    }
  }
  const moduleOf = id => S.nodes.find(n => n.id === id)?.module ?? ''
  const seedModules = new Set(seeds.map(moduleOf))

  const near = new Set(seeds)
  let frontier = [...seeds]
  hiddenCount = 0

  while (frontier.length && near.size < budget) {
    const layer = new Set()
    for (const cur of frontier) for (const other of adj.get(cur) ?? []) if (!near.has(other)) layer.add(other)
    if (!layer.size) break

    // 같은 모듈 먼저, 그다음 연결이 적은 것 먼저. 허브를 덜 끌어온다.
    const ranked = [...layer].sort((a, b) => {
      const ma = seedModules.has(moduleOf(a)) ? 0 : 1
      const mb = seedModules.has(moduleOf(b)) ? 0 : 1
      return ma - mb || (deg.get(a) ?? 0) - (deg.get(b) ?? 0) || (a < b ? -1 : 1)
    })
    const room = budget - near.size
    for (const id of ranked.slice(0, room)) near.add(id)
    hiddenCount += Math.max(0, ranked.length - room)
    frontier = ranked.slice(0, room)
  }
  return near
}

/** 관심의 출발점. 적을수록 그림이 선명해진다. */
function focusSeeds(list) {
  const ids = new Set(list.map(n => n.id))
  const seeds = []
  const add = id => {
    if (ids.has(id) && !seeds.includes(id)) seeds.push(id)
  }

  if (selected) add(selected)
  for (const a of S.activity) { if (seeds.length >= 3) break; add(a.file) }
  for (const n of list) { if (seeds.length >= 3) break; if (n.locked) add(n.id) }
  for (const s of S.suggestions) { if (seeds.length >= 3) break; add(s.file) }
  for (const f of S.features) { if (seeds.length >= 3) break; add(f.file) }
  return seeds
}

/**
 * 열 번호 = '들어오는 곳이 없는 노드' 로부터의 최장 거리.
 * 최단 거리로 하면 프론트->백엔드 화살표가 왼쪽으로 되돌아가서 그림이 엉킨다.
 * 최장 거리로 하면 모든 화살표가 오른쪽을 향한다.
 */
function assignLayers(nodes, edges) {
  const incoming = new Map(nodes.map(n => [n.id, []]))
  for (const e of edges) incoming.get(e.to)?.push(e.from)

  const layer = new Map()
  const visiting = new Set()
  const depth = id => {
    if (layer.has(id)) return layer.get(id)
    if (visiting.has(id)) return 0 // 순환 방어
    visiting.add(id)
    const ins = incoming.get(id) ?? []
    const d = ins.length ? Math.max(...ins.map(depth)) + 1 : 0
    visiting.delete(id)
    layer.set(id, d)
    return d
  }
  for (const n of nodes) depth(n.id)
  return layer
}

/** 앞 열에 연결된 노드들의 평균 높이로 정렬한다. 선 꼬임이 눈에 띄게 준다. */
function reduceCrossings(cols, order, edges) {
  const preds = new Map()
  for (const e of edges) {
    if (!preds.has(e.to)) preds.set(e.to, [])
    preds.get(e.to).push(e.from)
  }
  for (let pass = 0; pass < 3; pass++) {
    const rowOf = new Map()
    for (const L of order) cols.get(L).forEach((n, i) => rowOf.set(n.id, i))
    for (const L of order.slice(1)) {
      cols.get(L).sort((a, b) => bary(a) - bary(b) || (a.id < b.id ? -1 : 1))
    }
    function bary(n) {
      const ps = (preds.get(n.id) ?? []).map(p => rowOf.get(p)).filter(v => v !== undefined)
      return ps.length ? ps.reduce((x, y) => x + y, 0) / ps.length : rowOf.get(n.id) ?? 0
    }
  }
}

/** 이 열에서 제일 많은 폴더 이름. 열이 뭘 모아놨는지 사람이 알아보게. */
function commonDir(list) {
  const count = {}
  for (const n of list) {
    const d = n.module || n.id.split('/').slice(0, -1).join('/') || '/'
    count[d] = (count[d] ?? 0) + 1
  }
  const best = Object.entries(count).sort((a, b) => b[1] - a[1])[0]
  return best ? best[0] + (Object.keys(count).length > 1 ? ' ' + T('ui.andMoreShort') : '') : ''
}

const nodesOfFeature = fid => S.nodes.filter(n => n.features.includes(fid)).map(n => n.id)

// ---------------------------------------------------------------- 상세

function renderDetail() {
  const n = selected && S.nodes.find(x => x.id === selected)
  if (!n) {
    const top = S.suggestions[0]
    $('#detail').innerHTML = `
      <p class="hint">${T('ui.clickPrompt')}</p>
      ${top ? `<div class="card">
        <h2>${T('ui.riskiest')}</h2>
        <div class="path">${esc(top.file)}</div>
        <p class="hint" style="margin:6px 0 8px">${T('ui.riskiestHint', { kind: top.kind === 'module' ? T('ui.kindModule') : T('ui.kindFeature'), count: top.why.length })}</p>
        <button class="small danger" data-lock="${esc(top.file)}">${T('ui.protect')}</button>
      </div>` : ''}
      ${S.violations.length ? `<div class="card warn"><h2>${T('ui.violations', { count: S.violations.length })}</h2>
        ${S.violations.map(v => `<div class="path">${esc(v.from)} → ${esc(v.to)}</div>`).join('')}</div>` : ''}`
    return
  }
  const usedBy = S.edges.filter(e => e.to === selected).map(e => e.from)
  const uses = S.edges.filter(e => e.from === selected).map(e => e.to)
  const suggestion = S.suggestions.find(s => s.file === selected)

  $('#detail').innerHTML = `
    <div class="card ${n.locked ? 'warn' : ''}">
      <div style="font-size:14px;font-weight:600">${esc(n.label ?? selected.split('/').pop())}</div>
      <div class="path" style="opacity:.7">${esc(selected)}</div>
      <div style="margin-top:7px">
        ${n.locked ? `<span class="badge lock">🔒 ${T('ui.lockedBadge')}</span>` : ''}
        ${n.module ? `<span class="badge">${esc(n.moduleLabel ?? n.module)}</span>` : ''}
        ${(n.featureLabels ?? n.features).map(f => `<span class="badge">${esc(f)}</span>`).join('') || `<span class="badge">${T('ui.noFeatureYet')}</span>`}
      </div>
      <div class="row" style="margin-top:10px">
        <button class="small ${n.locked ? '' : 'danger'}" data-lock="${esc(selected)}" data-unlock="${n.locked ? '1' : ''}">
          ${n.locked ? T('ui.unprotect') : T('ui.protect')}
        </button>
      </div>
      ${suggestion ? `<p class="hint" style="margin:9px 0 0">${T('ui.sharedHint')}</p>` : ''}
    </div>
    <div class="card" id="inside">
      <h2>${T('ui.inside')}</h2>
      <p class="hint">${T('ui.linesCount', { count: n.lines ?? 0 })} · ${T('ui.symbolsCount', { count: n.symbols ?? 0 })}</p>
      ${n.doc ? `<p class="hint" style="margin-top:6px">${esc(n.doc)}</p>` : ''}
      <div id="inside-list"></div>
    </div>
    <div class="card">
      <h2>${T('ui.usedBy', { count: usedBy.length })}</h2>
      ${usedBy.length ? usedBy.map(f => `<div class="path">${esc(f)}</div>`).join('') : `<p class="empty">${T('ui.none')}</p>`}
    </div>
    <div class="card">
      <h2>${T('ui.uses', { count: uses.length })}</h2>
      ${uses.length ? uses.map(f => `<div class="path">${esc(f)}</div>`).join('') : `<p class="empty">${T('ui.none')}</p>`}
    </div>`

  void fillInside(selected)
}

/**
 * 파일 하나의 속.
 *
 * 한 파일에 몰아넣은 프로젝트에서는 '파일' 이 단위로 쓸모가 없다. 화면 여섯 개가
 * 한 파일에 있으면 파일이 1개라 아무것도 안 보인다. 안에 뭐가 몇 줄로 들어 있는지를
 * 봐야 '어디가 비대한지' 가 드러난다.
 *
 * 전부 /api/state 로 받으면 큰 레포에서 응답이 통째로 무거워진다. 누른 것만 가져온다.
 */
async function fillInside(file) {
  const box = $('#inside-list')
  if (!box) return
  let d
  try {
    const res = await fetch('/api/file?path=' + encodeURIComponent(file))
    if (!res.ok) throw new Error(String(res.status))
    d = await res.json()
  } catch {
    // 못 가져와도 상세 나머지는 그대로 보여준다 (P5)
    box.innerHTML = ''
    return
  }
  // 기다리는 사이에 다른 상자를 눌렀으면 버린다
  if (file !== selected) return
  const list = d.symbols ?? []
  if (!list.length) {
    box.innerHTML = `<p class="empty">${T('ui.insideEmpty')}</p>`
    return
  }
  const shown = list.slice(0, 12)
  // 제일 큰 것 대비 몇 %인지로 막대를 그린다. 절대 줄 수는 옆에 숫자로 있다.
  const biggest = Math.max(1, ...shown.map(sizeOf))
  box.innerHTML =
    shown
      .map(x => {
        const n = sizeOf(x)
        const pct = Math.round((100 * n) / biggest)
        return `<div class="sym">
          <div class="sym-head">
            <span class="sym-name">${esc(x.doc || x.name)}</span>
            <span class="sym-len">${T('ui.symbolLines', { count: n })}</span>
          </div>
          <div class="sym-bar"><i style="width:${pct}%"></i></div>
          ${x.doc ? `<div class="sym-sub">${esc(x.name)} · ${x.line}-${x.endLine}</div>` : `<div class="sym-sub">${x.line}-${x.endLine}</div>`}
        </div>`
      })
      .join('') + (list.length > shown.length ? `<p class="hint">${T('ui.insideMore', { count: list.length - shown.length })}</p>` : '')
}

const sizeOf = x => Math.max(1, (x.endLine ?? x.line) - x.line + 1)

// ---------------------------------------------------------------- 이벤트

document.addEventListener('click', async ev => {
  const featEl = ev.target.closest('[data-feature]')
  if (featEl) {
    activeFeature = featEl.dataset.feature
    activeModule = ''
    zoom = 'fit'
    render()
    writeHash()
    return
  }

  const nodeEl = ev.target.closest('[data-node]')
  if (nodeEl) {
    selected = nodeEl.dataset.node
    if (scope === 'near') zoom = 'fit'
    render()
    writeHash()
    return
  }

  const featLock = ev.target.closest('[data-featlock]')
  if (featLock) {
    const id = featLock.dataset.featlock
    const locked = !featLock.dataset.unlock
    const f = S.features.find(x => x.id === id)
    if (locked && !confirm(T('ui.confirmFeature', { id, count: f.exclusive }))) return
    await fetch('/api/lock-feature', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, locked, scope: 'exclusive' }),
    })
    await load()
    return
  }

  const lockBtn = ev.target.closest('[data-lock]')
  if (lockBtn) {
    const file = lockBtn.dataset.lock
    const locked = !lockBtn.dataset.unlock
    await fetch('/api/lock', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ file, locked }),
    })
    await load()
    return
  }

  if (ev.target.id === 'home-close') { homeClosed = true; zoom = 'fit'; render(); return }

  if (ev.target.id === 'lock-all') {
    const files = (S.suggestions ?? []).map(s => s.file)
    if (!files.length) return
    if (!confirm(T('ui.confirmAll', { count: files.length }))) return
    ev.target.disabled = true
    for (const file of files) {
      await fetch('/api/lock', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ file, locked: true, reason: T('ui.lockReasonShared') }),
      })
    }
    await load()
    return
  }

  if (ev.target.id === 'expand') { ev.preventDefault(); expandAll = true; zoom = 'fit'; render(); writeHash(); return }

  const seg = ev.target.closest('[data-scope]')
  if (seg) { scope = seg.dataset.scope; expandAll = false; zoom = 'fit'; render(); writeHash(); return }

  const modEl = ev.target.closest('[data-module]')
  if (modEl) {
    activeModule = modEl.dataset.module
    scope = 'module'
    activeFeature = ''
    zoom = 'fit'
    render()
    writeHash()
    return
  }

  if (ev.target.id === 'chk-empty') { showEmpty = ev.target.checked; drawGraph(); return }
  if (ev.target.id === 'btn-fit') { zoom = 'fit'; drawGraph(); return }
  if (ev.target.id === 'btn-zoom-in') { zoom = Math.min(2, zoom + 0.15); drawGraph(); return }
  if (ev.target.id === 'btn-zoom-out') { zoom = Math.max(0.4, zoom - 0.15); drawGraph(); return }

  if (ev.target.id === 'btn-rescan') {
    ev.target.disabled = true
    await fetch('/api/rescan', { method: 'POST' })
    await load()
    ev.target.disabled = false
  }
})

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s

function readHash() {
  const q = new URLSearchParams(location.hash.replace(/^#/, ''))
  activeFeature = q.get('feature') ?? ''
  activeModule = q.get('module') ?? ''
  if (q.get('scope')) scope = q.get('scope')
  else if (activeModule) scope = 'module'
  expandAll = q.get('expand') === '1'
  selected = q.get('file') ?? null
}

/** 지금 보고 있는 상태를 주소에 남긴다. 새로고침해도 유지되고 링크로 공유된다. */
function writeHash() {
  const q = new URLSearchParams()
  if (activeFeature) q.set('feature', activeFeature)
  else if (scope !== 'near') q.set('scope', scope)
  if (activeModule && scope === 'module') q.set('module', activeModule)
  if (expandAll) q.set('expand', '1')
  if (selected) q.set('file', selected)
  const next = q.toString()
  if (next !== location.hash.replace(/^#/, '')) history.replaceState(null, '', next ? '#' + next : ' ')
}
addEventListener('hashchange', () => { readHash(); zoom = 'fit'; render() })
readHash()

let fitTimer
addEventListener('resize', () => {
  clearTimeout(fitTimer)
  fitTimer = setTimeout(() => { zoom = 'fit'; drawGraph() }, 150)
})

load()
setInterval(load, 2000)
</script>
</body>
