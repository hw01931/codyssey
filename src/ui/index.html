<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CODYSSEY</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f6f7f9; --bg3: #eceef2;
    --fg: #14171c; --fg2: #5b6472; --line: #dfe3ea;
    --accent: #2f6df6; --lock: #d9480f; --lock-bg: #fff1e8;
    --ok: #1a7f37; --warn: #b7791f; --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --bg2: #1a1e25; --bg3: #232830;
      --fg: #e6e9ef; --fg2: #98a2b3; --line: #2c323c;
      --accent: #5b8cff; --lock: #ff8a5b; --lock-bg: #3a2318;
      --ok: #4ac26b; --warn: #e3b341; --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, "Segoe UI", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--bg2); position: sticky; top: 0; z-index: 10;
  }
  .logo { font-weight: 700; letter-spacing: .5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .dot.off { background: #d64545; }
  .counts { color: var(--fg2); font-size: 13px; display: flex; gap: 14px; }
  .counts b { color: var(--fg); font-variant-numeric: tabular-nums; }
  header .spacer { flex: 1; }
  button {
    font: inherit; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); cursor: pointer;
  }
  button:hover { background: var(--bg3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--lock); border-color: var(--lock); color: #fff; }
  button.small { padding: 3px 9px; font-size: 12px; }

  main { display: grid; grid-template-columns: 260px 1fr 320px; height: calc(100vh - 57px); }
  aside { overflow-y: auto; padding: 14px; border-right: 1px solid var(--line); background: var(--bg2); }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  section { margin-bottom: 22px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--fg2); margin: 0 0 8px; }
  .hint { font-size: 12px; color: var(--fg2); line-height: 1.5; margin: 0 0 10px; }

  .item {
    padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 13px;
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
  }
  .item:hover { background: var(--bg3); }
  .item.active { background: var(--accent); color: #fff; }
  .feat { margin-bottom: 4px; }
  .feat.locked .item { background: var(--lock-bg); }
  .featbar { padding: 0 9px 6px; }
  button.tiny {
    font-size: 11px; padding: 2px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg2); cursor: pointer;
  }
  button.tiny.danger { background: var(--bg); color: var(--lock); border-color: var(--lock); }
  button.tiny:hover { background: var(--bg3); }
  .item .num { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
  .path { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; word-break: break-all; }

  #canvas { overflow: auto; background: var(--bg); position: relative; }
  svg { display: block; }
  .node rect { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; rx: 7; cursor: pointer; }
  .node.entry rect { fill: var(--bg3); stroke: var(--accent); stroke-width: 2; }
  .node.locked rect { fill: var(--lock-bg); stroke: var(--lock); stroke-width: 2; }
  .node.sel rect { stroke: var(--accent); stroke-width: 3; }
  .node.dim { opacity: .18; }
  .node text { font-size: 11px; fill: var(--fg); pointer-events: none; font-family: ui-monospace, Consolas, monospace; }
  .node .sub { font-size: 9px; fill: var(--fg2); }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
  .edge.http { stroke: var(--accent); stroke-dasharray: 4 3; }
  .edge.hot { stroke: var(--accent); stroke-width: 2.4; }
  .edge.dim { opacity: .1; }

  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 9px; padding: 11px; margin-bottom: 9px; }
  .card.warn { border-color: var(--warn); }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 20px;
    background: var(--bg3); color: var(--fg2); margin: 2px 3px 2px 0;
  }
  .badge.lock { background: var(--lock-bg); color: var(--lock); }
  .row { display: flex; gap: 6px; align-items: center; }
  .empty { color: var(--fg2); font-size: 13px; padding: 8px 0; }
  .log { font-size: 12px; padding: 6px 8px; border-radius: 6px; margin-bottom: 5px; background: var(--bg3); }
  .log.block { background: var(--lock-bg); color: var(--lock); }
  .log time { opacity: .6; font-size: 11px; }
  .legend { font-size: 11px; color: var(--fg2); display: flex; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--line); }
  .colhead { font-size: 11px; fill: var(--fg2); font-weight: 700; }
  .colsub { font-size: 10px; fill: var(--fg2); opacity: .75; font-family: ui-monospace, Consolas, monospace; }
  .zoomlv { font-size: 12px; color: var(--fg2); min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
  .toggle { font-size: 12px; color: var(--fg2); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
</style>
</head>
<body>
<header>
  <span class="logo">CODYSSEY</span>
  <span><span class="dot" id="dot"></span></span>
  <div class="counts">
    <span>파일 <b id="c-files">-</b></span>
    <span>기능 <b id="c-features">-</b></span>
    <span>잠김 <b id="c-locks">-</b></span>
  </div>
  <div class="spacer"></div>
  <label class="toggle"><input type="checkbox" id="chk-empty"> 빈 파일도 보기</label>
  <button class="small" id="btn-fit">화면 맞춤</button>
  <button class="small" id="btn-zoom-out">−</button>
  <span id="zoomlv" class="zoomlv">100%</span>
  <button class="small" id="btn-zoom-in">+</button>
  <button id="btn-rescan">다시 스캔</button>
</header>

<main>
  <aside>
    <section>
      <h2>기능</h2>
      <p class="hint">사용자가 실제로 쓰는 화면과 API. 클릭하면 그 기능이 쓰는 파일만 보여줍니다.</p>
      <div class="item active" data-feature="" id="feat-all">
        <span>전체 보기</span>
      </div>
      <div id="features"></div>
    </section>

    <section>
      <h2>잠금 제안</h2>
      <p class="hint">여러 기능이 같이 쓰는 파일입니다. 여기가 깨지면 여러 곳이 한꺼번에 망가집니다.</p>
      <div id="suggestions"></div>
    </section>
  </aside>

  <div id="canvas"></div>

  <aside class="right">
    <section id="detail-wrap">
      <h2>선택한 파일</h2>
      <div id="detail"><p class="empty">가운데 그림에서 상자를 클릭해 보세요.</p></div>
    </section>

    <section>
      <h2>활동</h2>
      <p class="hint">AI가 파일을 고치려 할 때 여기에 기록됩니다.</p>
      <div id="activity"><p class="empty">아직 없습니다.</p></div>
    </section>
  </aside>
</main>

<div class="legend">
  <span><span class="swatch" style="background:var(--bg3);border:2px solid var(--accent)"></span>기능 시작점</span>
  <span><span class="swatch" style="background:var(--lock-bg);border:2px solid var(--lock)"></span>잠긴 파일</span>
  <span><span class="swatch" style="background:var(--accent)"></span>프론트 → 백엔드 호출</span>
</div>

<script>
const $ = s => document.querySelector(s)
let S = null, selected = null, activeFeature = '', showEmpty = false, zoom = 'fit'

async function load() {
  try {
    S = await (await fetch('/api/state')).json()
    $('#dot').classList.remove('off')
  } catch {
    $('#dot').classList.add('off')
    return
  }
  render()
}

function render() {
  const chk = $('#chk-empty'); if (chk) chk.checked = showEmpty
  $('#c-files').textContent = S.counts.files
  $('#c-features').textContent = S.counts.features
  $('#c-locks').textContent = S.counts.locks

  $('#features').innerHTML = S.features.map(f => `
    <div class="feat ${f.locked ? 'locked' : ''}">
      <div class="item ${activeFeature === f.id ? 'active' : ''}" data-feature="${esc(f.id)}">
        <span>${f.locked ? '🔒 ' : ''}${esc(label(f))}</span><span class="num">${f.size}</span>
      </div>
      <div class="featbar">
        <button class="tiny ${f.locked ? '' : 'danger'}"
                data-featlock="${esc(f.id)}" data-unlock="${f.locked ? '1' : ''}">
          ${f.locked ? '기능 잠금 해제' : `이 기능 잠그기 (${f.exclusive}개)`}
        </button>
      </div>
    </div>`).join('')
  $('#feat-all').classList.toggle('active', !activeFeature)

  $('#suggestions').innerHTML = S.suggestions.length
    ? S.suggestions.map(s => `
      <div class="card">
        <div class="path">${esc(s.file)}</div>
        <div>${s.features.map(f => `<span class="badge">${esc(shortFeature(f))}</span>`).join('')}</div>
        <div class="row" style="margin-top:8px">
          <button class="small danger" data-lock="${esc(s.file)}">잠그기</button>
        </div>
      </div>`).join('')
    : '<p class="empty">제안할 게 없습니다.</p>'

  $('#activity').innerHTML = S.activity.length
    ? S.activity.map(a => `
      <div class="log ${a.action === 'block' ? 'block' : ''}">
        <time>${new Date(a.at).toLocaleTimeString('ko-KR')}</time>
        ${a.action === 'block' ? '차단' : a.action === 'ask' ? '확인 요청' : '통과'}
        &middot; <span class="path">${esc(a.file)}</span>
        ${a.reason ? `<div style="margin-top:3px">${esc(a.reason)}</div>` : ''}
      </div>`).join('')
    : '<p class="empty">아직 없습니다.</p>'

  drawGraph()
  renderDetail()
}

const label = f => f.kind === 'page' ? f.id.replace('PAGE ', '화면 ') : f.id
const shortFeature = id => id.replace('PAGE ', '')

// ---------------------------------------------------------------- 그래프

const W = 186, H = 46, GAP = 22, HEAD = 34

function drawGraph() {
  const shown = visibleNodes()
  const ids = new Set(shown.map(n => n.id))
  const edges = S.edges.filter(e => ids.has(e.from) && ids.has(e.to))
  const focus = activeFeature ? new Set(nodesOfFeature(activeFeature)) : null

  const layer = assignLayers(shown, edges)
  const cols = new Map()
  for (const n of shown) {
    const L = layer.get(n.id) ?? 0
    if (!cols.has(L)) cols.set(L, [])
    cols.get(L).push(n)
  }
  const order = [...cols.keys()].sort((a, b) => a - b)
  order.forEach(L => cols.get(L).sort((a, b) => (a.id < b.id ? -1 : 1)))
  reduceCrossings(cols, order, edges)

  // 층이 많고 층당 노드가 적으면 위->아래가, 반대면 왼쪽->오른쪽이 화면에 잘 맞는다.
  const box = $('#canvas')
  const rows = Math.max(...order.map(L => cols.get(L).length))
  const vertical = pickOrientation(order.length, rows, box)
  const layout = place(cols, order, vertical)

  if (zoom === 'fit') {
    zoom = Math.max(0.4, Math.min(1, (box.clientWidth - 28) / layout.width, (box.clientHeight - 28) / layout.height))
  }

  const heads = order.map((L, i) => {
    const a = layout.head(i)
    const name = i === 0 ? '시작점' : `${i}단계`
    return `<text class="colhead" x="${a.x}" y="${a.y}">${esc(name)}</text>` +
           `<text class="colsub" x="${a.x}" y="${a.y + 13}">${esc(commonDir(cols.get(L)))}</text>`
  }).join('')

  const paths = edges.map(e => {
    const a = layout.pos.get(e.from), b = layout.pos.get(e.to)
    if (!a || !b) return ''
    const dim = focus && !(focus.has(e.from) && focus.has(e.to))
    const hot = selected && (e.from === selected || e.to === selected)
    const d = vertical
      ? bez(a.x + W / 2, a.y + H, b.x + W / 2, b.y, true)
      : bez(a.x + W, a.y + H / 2, b.x, b.y + H / 2, false)
    return `<path class="edge ${e.kind} ${dim ? 'dim' : ''} ${hot ? 'hot' : ''}" d="${d}"/>`
  }).join('')

  const boxes = shown.map(n => {
    const p = layout.pos.get(n.id)
    if (!p) return ''
    const dim = focus && !focus.has(n.id)
    const cls = ['node', n.isEntry && 'entry', n.locked && 'locked', selected === n.id && 'sel', dim && 'dim'].filter(Boolean).join(' ')
    const name = n.id.split('/').pop()
    const dir = n.id.slice(0, n.id.length - name.length)
    return `<g class="${cls}" data-node="${esc(n.id)}">
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}"></rect>
      <text x="${p.x + 10}" y="${p.y + 19}">${esc(trunc(name, 23))}${n.locked ? ' 🔒' : ''}</text>
      <text class="sub" x="${p.x + 10}" y="${p.y + 34}">${esc(trunc(dir, 29))}</text>
    </g>`
  }).join('')

  $('#canvas').innerHTML =
    `<svg width="${Math.round(layout.width * zoom)}" height="${Math.round(layout.height * zoom)}"
          viewBox="0 0 ${layout.width} ${layout.height}">${heads}${paths}${boxes}</svg>`
  $('#zoomlv').textContent = Math.round(zoom * 100) + '%'
}

const bez = (x1, y1, x2, y2, v) =>
  v ? `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`
    : `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}`

/** 두 방향의 가로세로 비를 실제 캔버스와 비교해서 덜 찌그러지는 쪽을 고른다. */
function pickOrientation(layers, rows, box) {
  const aw = Math.max(300, box.clientWidth - 28)
  const ah = Math.max(300, box.clientHeight - 28)
  const horiz = Math.min(aw / (layers * (W + GAP)), ah / (rows * (H + GAP) + HEAD))
  const vert = Math.min(aw / (rows * (W + GAP)), ah / (layers * (H + GAP + HEAD)))
  return vert > horiz
}

function place(cols, order, vertical) {
  const pos = new Map()
  let width = 0
  let height = 0
  order.forEach((L, i) => {
    const list = cols.get(L)
    list.forEach((n, r) => {
      const p = vertical
        ? { x: 20 + r * (W + GAP), y: HEAD + i * (H + GAP + HEAD) }
        : { x: 20 + i * (W + GAP), y: HEAD + 8 + r * (H + GAP) }
      pos.set(n.id, p)
      width = Math.max(width, p.x + W + 20)
      height = Math.max(height, p.y + H + 20)
    })
  })
  const head = i =>
    vertical ? { x: 20, y: HEAD + i * (H + GAP + HEAD) - 20 } : { x: 20 + i * (W + GAP), y: 16 }
  return { pos, width, height, head }
}

/** 빈 파일(심볼도 연결도 없는 __init__.py 같은 것)은 기본으로 숨긴다. */
function visibleNodes() {
  if (showEmpty) return S.nodes
  return S.nodes.filter(n => n.isEntry || n.symbols > 0)
}

/**
 * 열 번호 = '들어오는 곳이 없는 노드' 로부터의 최장 거리.
 * 최단 거리로 하면 프론트->백엔드 화살표가 왼쪽으로 되돌아가서 그림이 엉킨다.
 * 최장 거리로 하면 모든 화살표가 오른쪽을 향한다.
 */
function assignLayers(nodes, edges) {
  const incoming = new Map(nodes.map(n => [n.id, []]))
  for (const e of edges) incoming.get(e.to)?.push(e.from)

  const layer = new Map()
  const visiting = new Set()
  const depth = id => {
    if (layer.has(id)) return layer.get(id)
    if (visiting.has(id)) return 0 // 순환 방어
    visiting.add(id)
    const ins = incoming.get(id) ?? []
    const d = ins.length ? Math.max(...ins.map(depth)) + 1 : 0
    visiting.delete(id)
    layer.set(id, d)
    return d
  }
  for (const n of nodes) depth(n.id)
  return layer
}

/** 앞 열에 연결된 노드들의 평균 높이로 정렬한다. 선 꼬임이 눈에 띄게 준다. */
function reduceCrossings(cols, order, edges) {
  const preds = new Map()
  for (const e of edges) {
    if (!preds.has(e.to)) preds.set(e.to, [])
    preds.get(e.to).push(e.from)
  }
  for (let pass = 0; pass < 3; pass++) {
    const rowOf = new Map()
    for (const L of order) cols.get(L).forEach((n, i) => rowOf.set(n.id, i))
    for (const L of order.slice(1)) {
      cols.get(L).sort((a, b) => bary(a) - bary(b) || (a.id < b.id ? -1 : 1))
    }
    function bary(n) {
      const ps = (preds.get(n.id) ?? []).map(p => rowOf.get(p)).filter(v => v !== undefined)
      return ps.length ? ps.reduce((x, y) => x + y, 0) / ps.length : rowOf.get(n.id) ?? 0
    }
  }
}

/** 이 열에서 제일 많은 폴더 이름. 열이 뭘 모아놨는지 사람이 알아보게. */
function commonDir(list) {
  const count = {}
  for (const n of list) {
    const d = n.id.split('/').slice(0, -1).join('/') || '/'
    count[d] = (count[d] ?? 0) + 1
  }
  const best = Object.entries(count).sort((a, b) => b[1] - a[1])[0]
  return best ? best[0] + (Object.keys(count).length > 1 ? ' 외' : '') : ''
}

const nodesOfFeature = fid => S.nodes.filter(n => n.features.includes(fid)).map(n => n.id)

// ---------------------------------------------------------------- 상세

function renderDetail() {
  const n = selected && S.nodes.find(x => x.id === selected)
  if (!n) {
    const top = S.suggestions[0]
    $('#detail').innerHTML = `
      <p class="hint">가운데 그림에서 상자를 클릭하면 그 파일이 어디에 쓰이는지 보여줍니다.</p>
      ${top ? `<div class="card">
        <h2>가장 위험한 파일</h2>
        <div class="path">${esc(top.file)}</div>
        <p class="hint" style="margin:6px 0 8px">기능 ${top.features.length}개가 함께 씁니다. 여기가 깨지면 ${top.features.length}곳이 한꺼번에 망가집니다.</p>
        <button class="small danger" data-lock="${esc(top.file)}">잠그기</button>
      </div>` : ''}
      ${S.violations.length ? `<div class="card warn"><h2>규칙 위반 ${S.violations.length}건</h2>
        ${S.violations.map(v => `<div class="path">${esc(v.from)} → ${esc(v.to)}</div>`).join('')}</div>` : ''}`
    return
  }
  const usedBy = S.edges.filter(e => e.to === selected).map(e => e.from)
  const uses = S.edges.filter(e => e.from === selected).map(e => e.to)
  const suggestion = S.suggestions.find(s => s.file === selected)

  $('#detail').innerHTML = `
    <div class="card ${n.locked ? 'warn' : ''}">
      <div class="path" style="font-size:13px">${esc(selected)}</div>
      <div style="margin-top:7px">
        ${n.locked ? '<span class="badge lock">🔒 잠김</span>' : ''}
        ${n.features.map(f => `<span class="badge">${esc(shortFeature(f))}</span>`).join('') || '<span class="badge">어느 기능에도 안 쓰임</span>'}
      </div>
      <div class="row" style="margin-top:10px">
        <button class="small ${n.locked ? '' : 'danger'}" data-lock="${esc(selected)}" data-unlock="${n.locked ? '1' : ''}">
          ${n.locked ? '잠금 해제' : '잠그기'}
        </button>
      </div>
      ${suggestion ? '<p class="hint" style="margin:9px 0 0">여러 기능이 공유합니다. 잠그면 AI가 함부로 못 고칩니다.</p>' : ''}
    </div>
    <div class="card">
      <h2>이 파일을 쓰는 곳 (${usedBy.length})</h2>
      ${usedBy.length ? usedBy.map(f => `<div class="path">${esc(f)}</div>`).join('') : '<p class="empty">없음</p>'}
    </div>
    <div class="card">
      <h2>이 파일이 쓰는 것 (${uses.length})</h2>
      ${uses.length ? uses.map(f => `<div class="path">${esc(f)}</div>`).join('') : '<p class="empty">없음</p>'}
    </div>`
}

// ---------------------------------------------------------------- 이벤트

document.addEventListener('click', async ev => {
  const featEl = ev.target.closest('[data-feature]')
  if (featEl) {
    activeFeature = featEl.dataset.feature
    location.hash = activeFeature ? 'feature=' + encodeURIComponent(activeFeature) : ''
    zoom = 'fit'
    render()
    return
  }

  const nodeEl = ev.target.closest('[data-node]')
  if (nodeEl) { selected = nodeEl.dataset.node; render(); return }

  const featLock = ev.target.closest('[data-featlock]')
  if (featLock) {
    const id = featLock.dataset.featlock
    const locked = !featLock.dataset.unlock
    const f = S.features.find(x => x.id === id)
    if (locked && !confirm(`'${id}' 기능만 쓰는 파일 ${f.exclusive}개를 잠급니다.
여러 기능이 공유하는 파일은 건드리지 않습니다.`)) return
    await fetch('/api/lock-feature', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, locked, scope: 'exclusive' }),
    })
    await load()
    return
  }

  const lockBtn = ev.target.closest('[data-lock]')
  if (lockBtn) {
    const file = lockBtn.dataset.lock
    const locked = !lockBtn.dataset.unlock
    await fetch('/api/lock', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ file, locked }),
    })
    await load()
    return
  }

  if (ev.target.id === 'chk-empty') { showEmpty = ev.target.checked; drawGraph(); return }
  if (ev.target.id === 'btn-fit') { zoom = 'fit'; drawGraph(); return }
  if (ev.target.id === 'btn-zoom-in') { zoom = Math.min(2, zoom + 0.15); drawGraph(); return }
  if (ev.target.id === 'btn-zoom-out') { zoom = Math.max(0.4, zoom - 0.15); drawGraph(); return }

  if (ev.target.id === 'btn-rescan') {
    ev.target.disabled = true
    await fetch('/api/rescan', { method: 'POST' })
    await load()
    ev.target.disabled = false
  }
})

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s

function readHash() {
  const m = /feature=([^&]+)/.exec(location.hash)
  activeFeature = m ? decodeURIComponent(m[1]) : ''
}
addEventListener('hashchange', () => { readHash(); zoom = 'fit'; render() })
readHash()

let fitTimer
addEventListener('resize', () => {
  clearTimeout(fitTimer)
  fitTimer = setTimeout(() => { zoom = 'fit'; drawGraph() }, 150)
})

load()
setInterval(load, 2000)
</script>
